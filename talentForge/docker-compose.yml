version: '3.8'

services:
  # Service IA - Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: talentforge_ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0

  # Application Django
  web:
    build: .
    container_name: talentforge_web
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1  # Changé à 1 pour développement
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,192.168.0.60
      
      # Database (votre configuration existante)
      - DB_HOST=192.168.0.60
      - DB_PORT=5432
      - DB_NAME=djangodb
      - DB_USER=django_user
      - DB_PASSWORD=DjangoSecurePass123!
      
      # Ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      
      # Performance
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    
    depends_on:
      - ollama
    
    command: python manage.py runserver 0.0.0.0:8000
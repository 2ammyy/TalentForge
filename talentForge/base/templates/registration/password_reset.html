{% extends 'base.html' %}

{% block title %}Reset Password - TalentForge{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Reset Your Password</h4>
            </div>
            <div class="card-body">
                <p class="mb-3">Enter your email address and we'll send you instructions to reset your password.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_email" class="form-label">Email:</label>
                        {{ form.email }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">Send Reset Instructions</button>
                </form>
                <div class="text-center">
                    <a href="{% url 'base:login' %}">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

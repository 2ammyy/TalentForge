{% extends 'base.html' %}
{% load static %} 

{% block title %}Logged Out - TalentForge{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow text-center">
            <div class="card-body p-5">
                <div class="text-success mb-3">
                    <i class="fas fa-check-circle fa-4x"></i>
                </div>
                <h2 class="mb-3">You have been successfully logged out!</h2>
                <p class="text-muted mb-4">Thank you for using TalentForge.</p>
                <div class="d-grid gap-2 d-md-block">
                    <a href="{% url 'base:login' %}" class="btn btn-primary me-2">Login Again</a>
                    <a href="{% url 'base:home' %}" class="btn btn-outline-secondary">Go to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% load static %} 

{% block title %}Password Reset Complete - TalentForge{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow text-center">
            <div class="card-body p-5">
                <div class="text-success mb-3">
                    <i class="fas fa-check-circle fa-4x"></i>
                </div>
                <h2 class="mb-3">Password Reset Complete</h2>
                <p class="mb-4">Your password has been set. You may go ahead and log in now.</p>
                <a href="{% url 'base:login' %}" class="btn btn-primary">Log In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
